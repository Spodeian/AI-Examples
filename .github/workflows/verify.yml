name: Verify AI-Examples

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  verify-python:
    name: Python Verification on ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint and Format Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checks
        run: |
          mypy core

      - name: Verify Multi-Track Symmetry, Contracts, Links, and Notebook Execution
        run: |
          python scripts/verify_repo.py check --semantics --format github
          python scripts/verify_repo.py --run

      - name: Run Test Suite
        run: |
          pytest tests/

