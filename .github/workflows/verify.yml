name: Verify AI-Examples

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-python:
    name: Python Verification on ${{ matrix.os }} (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint and Format Checks
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checks
        run: |
          mypy core

      - name: Verify Multi-Track Symmetry, Contracts, Links, and Notebook Execution
        run: |
          python scripts/verify_repo.py check --semantics --format github
          python scripts/verify_repo.py --run

      - name: Run Test Suite
        run: |
          pytest tests/

  verify-rust:
    name: Rust Workspace Verification on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build aix Release Binary & Verify Repository Contracts
        run: |
          cargo build --release -p aix
          cargo aix check --semantics --format github

      - name: Run Rust Workspace Crate Tests (aix, schema, ai-candle, ai-kernel)
        run: |
          cargo test --workspace --tests
