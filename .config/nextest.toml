# Nextest configuration for AI-Examples workspace
# Documentation: https://nexte.st/book/configuration.html

[profile.default]
fail-fast = true
retries = 0
test-threads = "num-cpus"

# Default filter: skip tests with 'heavy' in name unless explicitly requested
# e.g.: cargo nextest run (skips heavy)
#       cargo nextest run -E 'test(heavy)' (runs heavy)
default-filter = 'not test(heavy)'

# Limit concurrency on heavy or GPU-bound tests to prevent driver resource starvation
[test-groups]
heavy = { max-threads = 2 }

[[profile.default.overrides]]
filter = 'test(heavy)'
test-group = 'heavy'
slow-timeout = { period = "60s", terminate-after = 2 }

[profile.ci]
fail-fast = false
retries = 1
default-filter = 'all()' # In CI, run everything including heavy tests
junit = { path = "target/nextest/ci-junit.xml" }
