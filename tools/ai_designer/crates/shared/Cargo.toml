[package]
name = "shared"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core business models, serialization, state management, and export logic"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ron = { workspace = true }
toml = { workspace = true }
safetensors = { workspace = true }
crc32fast = { workspace = true }
byteorder = { workspace = true }
bson = { workspace = true }
miniz_oxide = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
spodeian-export = { workspace = true }
spodeian-tokens = { workspace = true }

[features]
default = ["std"]
std = ["serde/std", "serde_json/std", "thiserror/std"]

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "serialization_benchmarks"
harness = false
