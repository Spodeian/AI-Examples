repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        files: '^notebooks/.*\.ipynb$'
        description: "Strip execution counts and output cells from Jupyter notebooks"

  - repo: local
    hooks:
      - id: cargo-check
        name: cargo check workspace
        entry: cargo check --workspace
        language: system
        files: '\.rs$|Cargo\.(toml|lock)$'
        pass_filenames: false
      - id: pytest-fast
        name: pytest fast invariants
        entry: .venv/Scripts/pytest
        language: system
        files: '\.py$'
        pass_filenames: false
