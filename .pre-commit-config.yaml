repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        description: "Strip execution counts and output cells from Jupyter notebooks"

  - repo: https://github.com/mwouts/jupytext
    rev: v1.16.2
    hooks:
      - id: jupytext
        name: jupytext sync (.ipynb <-> .py:percent)
        args: [--sync]
        files: '^(0[0-9]|1[0-7])_.*\.ipynb$'
