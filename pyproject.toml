[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-examples-core"
version = "0.1.0"
description = "Deterministic, zero-overhead core utilities and micro-generators for AI-Examples"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AI-Examples Contributors" }
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "safetensors>=0.4.0",
    "einops>=0.7.0",
    "tabulate>=0.9.0",
    "jupytext>=1.16.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
